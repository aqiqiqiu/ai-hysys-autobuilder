[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hysys-autobuilder"
version = "0.1.0"
description = "AI reactor selection + Aspen HYSYS V15 COM automation (Conversion/Equilibrium/Gibbs)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AI Engineering Agent" }]
dependencies = ["pywin32>=306"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

